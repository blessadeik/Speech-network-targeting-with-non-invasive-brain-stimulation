# TMS coils (Methods Protocol v0.2, section 7). Filenames verified in the 4.6.0 coil library.
defaults:
  coil_to_scalp_mm: 4
  didt_A_per_us: 1.0

coils:
  figure8:
    fnamecoil: "MagVenture_MCF-B65.ccd"   # present in 4.6.0 resources/coil_models
    type: figure8
    use_for: [L_IFG, L_pSTG, L_dLMC, L_vLMC]
  double_cone:
    fnamecoil: "MagVenture_Cool-D-B80.ccd" # 4.6.0 Drakaki_BrainStim_2022 set; dipoles span 72 mm in z (angled wings, not flat)
    type: double_cone
    use_for: [L_dLMC, L_vLMC]

optimization:                              # s06 TMSoptimize
  method: ADM                              # 4.6.0: 'direct' or 'ADM' (ADM needs dipole coils, e.g. .ccd)
  search_radius_mm: 20
  spatial_resolution_mm: 4
  search_angle_deg: 360
  angle_resolution_deg: 15

orientation_sweep:                         # s04 --sweep-at-optimum, all heads
  orientations_deg: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]

grid_search:                               # s04 --grid, Ernie + 10 heads only
  heads_listed_in: data/derived/tms_grid_heads.txt
  search_radius_mm: 20
  spatial_resolution_mm: 5
  orientations_deg: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
  quick: {search_radius_mm: 0, orientations_deg: [45, 135]}
