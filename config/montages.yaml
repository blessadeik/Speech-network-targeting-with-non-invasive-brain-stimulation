# tDCS montage families, applied to every ROI (Methods Protocol v0.2, section 6).
# Target electrode = 10-10 position nearest the scalp projection of the ROI centroid,
# computed per head. Every return electrode gets its own channel so the per-electrode
# current is exactly what is listed (shared channels split current by impedance).

defaults:
  reference_current_mA: 2.0
  cap: EEG10-10_UI_Jurak_2007          # API-CHECK name in m2m/eeg_positions
  pad: {shape: rect, dimensions_mm: [50, 70], thickness_mm: 5}
  hd: {shape: ellipse, dimensions_mm: [10, 10], thickness_mm: 5}
  report_per_mA: true

families:
  conventional:
    target: {electrode: pad, current_mA: 2.0}
    returns: [{at: label, label: Fp2, electrode: pad, current_mA: -2.0}]

  hd_4x1:
    target: {electrode: hd, current_mA: 2.0}
    returns:
      ring: {n: 4, radius_mm: 40, electrode: hd, current_mA_each: -0.5}

  bilateral:
    target: {electrode: pad, current_mA: 2.0}
    returns: [{at: homolog_projection, electrode: pad, current_mA: -2.0}]

  extracephalic:                        # Ernie Extended only
    only_heads: [ernie_extended]
    target: {electrode: pad, current_mA: 2.0}
    returns: [{at: subject_coords, coords: null, electrode: pad, current_mA: -2.0}]
    # VERIFY: right deltoid/shoulder coordinate in the Ernie Extended mesh

apply_to_rois: [L_IFG, L_pSTG, L_dLMC, L_vLMC]

optimization:
  electrode_set: EEG10-10_UI_Jurak_2007
  electrode: {shape: ellipse, dimensions_mm: [10, 10], thickness_mm: 5}
  max_total_current_mA: 2.0
  max_individual_current_mA: 1.0
  max_active_electrodes: 8
  target_direction: normal
  target_intensity_Vm: 1.0              # deliberately unreachable => optimizer maximizes
  avoid_homolog: {weight: 1000}         # API-CHECK TDCSavoid attributes
  run_for_rois: [L_IFG, L_pSTG, L_dLMC, L_vLMC]
