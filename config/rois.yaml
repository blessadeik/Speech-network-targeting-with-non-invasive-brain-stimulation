# ROI definitions: single source of truth for targets (Methods Protocol v0.2, section 5).
# Seeds are MNI152; mapped per head with simnibs.mni2subject_coords and evaluated on the
# charm central GM surface (lh then rh). Items marked LOCK must be settled before OSF
# registration; items marked API-CHECK are resolved in Stage 1 against SimNIBS 4.6.0.

space: MNI152
atlas: HCP_MMP1            # accepted by simnibs.atlas2subject (4.6.0: a2009s, DK40, HCP_MMP1)
surface: central
hemisphere: left

rois:
  L_IFG:
    label: "Left IFG (pars opercularis + triangularis)"
    definition: atlas                  # full labels, no sphere
    atlas_labels: ["L_44", "L_45"]     # keys from utils.subject_atlas_masks ('L_'/'R_' + HCP name)
    homolog_labels: ["R_44", "R_45"]
    mni_seed: null                     # centroid of labels is computed per head
    radius_mm: null
    alternate: {definition: sphere_at_label_centroid, radius_mm: 10}
    provenance: "HCP-MMP1 (Glasser et al. 2016)"

  L_pSTG:
    label: "Left posterior STG/STS"
    definition: atlas
    atlas_labels: ["L_A4", "L_A5", "L_STV", "L_PSL"]   # LOCK: choose from Ernie overlays (Stage 2)
    homolog_labels: ["R_A4", "R_A5", "R_STV", "R_PSL"] # LOCK with the left set
    mni_seed: null
    radius_mm: null
    alternate: {definition: sphere_at_label_centroid, radius_mm: 10}
    provenance: "HCP-MMP1; label set locked from Ernie overlay review"

  L_dLMC:
    label: "Left dorsal laryngeal motor cortex"
    definition: sphere
    mni_seed: [-42, -16, 38]           # locked: MNI152, Belyk, Eichert & McGettigan 2021, Phil Trans R Soc B 376:20200392, Table 1
    radius_mm: 8
    alternate: {definition: sphere, mni_seed: [-40, -5, 50], radius_mm: 8,
                provenance: "Lu et al. 2022 functional localizer, n = 48"}
    provenance: "Belyk, Eichert & McGettigan 2021, Phil Trans R Soc B 376:20200392"

  L_vLMC:
    label: "Left ventral laryngeal motor cortex"
    definition: sphere
    mni_seed: [-64, -4, 14]            # locked: MNI152, Belyk, Eichert & McGettigan 2021, Phil Trans R Soc B 376:20200392, Table 1
    radius_mm: 8
    project_seed_to_gm: true           # lateral seed may land outside GM; log distance
    alternate: {definition: sphere, mni_seed: [-58, -2, 20], radius_mm: 8,
                provenance: "Eichert et al. 2020 Cereb Cortex, as cited in Brain Commun 2021"}
    provenance: "Belyk, Eichert & McGettigan 2021"

avoidance:
  contralateral_homologs: true         # atlas ROIs use homolog_labels; spheres mirror x
  eyes: {tissue_tag: 6, face_dependent: true}        # EYE_BALLS = 6 in 4.6.0 ElementTags
  local_muscle: {tissue_tag: 10, radius_mm: 50, face_dependent: true}
  # local_muscle = muscle within 50 mm of the stimulation site (temporalis proxy)

robustness:
  seed_shifts_mm: 5                    # +/- along x, y, z: 6 variants
  radii_mm: [6, 8, 10, 12]
  alternate_sources: true

notes: >
  Peripheral nerves are not segmented in SimNIBS; scalp, muscle and eye fields are
  reported as proxies for peripheral exposure.
