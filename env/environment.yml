# Analysis environment (statistics, figures, cohort building). NOT for SimNIBS, which uses
# its own installer and simnibs_python. Pin versions after Stage 1.
name: nibs-speech-analysis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - pyyaml
  - matplotlib
  - seaborn
  - statsmodels
  - nibabel
  - pytest
  - jupyterlab
  - r-base
  - r-lme4
  - pip
  - pip:
      - pymer4        # lme4 cross-check of statsmodels mixed models
      - pydeface      # only if ARC's own defacing tool is unavailable
      - openneuro-py  # ARC download (or use datalad)
